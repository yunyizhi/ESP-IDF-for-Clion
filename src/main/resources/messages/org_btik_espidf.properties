espidf.mcp.run.task.name=Run an ESP-IDF task by name
espidf.mcp.run.task.desc=Execute any non-interactive ESP-IDF task (build, flash, size, custom commands, etc.) by its name. Use espidf_list_tasks to discover available task names. Set 'async' to true to trigger the task and return immediately (status=running); otherwise the call waits for the task to finish (or until 'waitSeconds' elapses) and returns status=exited together with the captured output and exit code. Use 'maxLines' to cap the number of returned output lines (default 200; use 0 for no limit); when truncated, exactly the last 'maxLines' complete lines are returned and the truncation is flagged in both the text and the 'truncated'/'omittedLines' fields. For long-running tasks trigger with 'async' and poll new output with espidf_fetch_task_output.
espidf.mcp.run.task.param.task=Name of the ESP-IDF task to run. Call espidf_list_tasks to discover available tasks. Accepts the task id, its display name, or its full path (e.g. "Build", "flash/Flash"), case-insensitive.
espidf.mcp.run.task.param.async=If true, trigger the task and return immediately with status 'running' without waiting for it to finish (use for long-running or monitor tasks). If false (default), wait for the task to finish and return status 'exited'.
espidf.mcp.run.task.param.waitSeconds=Maximum number of seconds to wait for the task to finish before returning (the general wait timeout, applies to all tasks). Defaults to 600 seconds. Ignored when 'async' is true.
espidf.mcp.run.task.no.project=Unable to determine the target project. Pass the project path via the `projectPath` parameter (the JetBrains MCP server resolves it to an open project).
espidf.mcp.run.task.missing.param=Missing required parameter 'task'. Call espidf_list_tasks to see available tasks.
espidf.mcp.run.task.unknown=Unknown ESP-IDF task '%s'. Call espidf_list_tasks to see available tasks.
espidf.mcp.run.task.triggered=ESP-IDF task '%s' has been triggered. Its output is available in the IDE console / tool window.
espidf.mcp.run.task.no.output=ESP-IDF task '%s' was triggered but produced no captured output.
espidf.mcp.run.task.finished=ESP-IDF task '%s' finished with exitCode=%d
espidf.mcp.run.task.failed=Failed to execute task '%s': %s
espidf.mcp.run.task.timeout=ESP-IDF task '%s' is still running after %d seconds (status=running); captured output so far:
espidf.mcp.run.task.field.status=Result status: 'running' while the task is still executing (or was only triggered), 'exited' once it finished.
espidf.mcp.run.task.field.taskName=Display name of the task.
espidf.mcp.run.task.field.exitCode=Process exit code; absent when the task was only triggered or is still running without a code.
espidf.mcp.run.task.field.output=Raw combined stdout/stderr captured from the task.
espidf.mcp.run.task.field.message=Human readable message for errors or non-result states.
espidf.mcp.run.task.param.maxLines=Maximum number of trailing output lines to return. Defaults to 200; set 0 or a negative value for no limit.
espidf.mcp.run.task.field.truncated=True when the returned output was truncated to the last maxLines lines.
espidf.mcp.run.task.field.omittedLines=Number of leading output lines dropped due to truncation.
espidf.mcp.run.task.field.taskId=taskId of the started task; pass it to espidf_terminate_task to stop the task.
espidf.mcp.run.task.triggered.with.task.id=ESP-IDF task '%s' has been triggered (taskId=%d). Use espidf_fetch_task_output to poll its output, or espidf_terminate_task to stop it.
espidf.mcp.run.task.running.task.id=taskId=%d (use espidf_fetch_task_output to poll new output, or espidf_terminate_task to stop it).
espidf.mcp.output.truncated.note=[output truncated: kept the last %d lines, %d earlier line(s) dropped]
espidf.mcp.fetch.task.name=Fetch new output of a running ESP-IDF task
espidf.mcp.fetch.task.desc=Return the output that a running ESP-IDF task (taskId from espidf_list_running_tasks or espidf_run_task) produced between the start of this call and the end of the wait. The call subscribes to the live process and blocks for at most 'waitSeconds' seconds (default 30; 0 returns immediately), returning only the output captured in that window. Use 'maxLines' to cap the number of returned lines (default 200; 0 or negative for no limit); when the output is cut, exactly the last 'maxLines' complete lines are kept and the truncation is flagged in both the text and the 'truncated'/'omittedLines' fields. status is 'running' when the task is still alive when the wait ends, 'exited' when it finished, 'not_found' when the taskId is unknown. Typically used together with espidf_run_task(async=true) to poll long-running tasks.
espidf.mcp.fetch.task.param.taskId=taskId of the running task whose new output should be fetched (from espidf_list_running_tasks or the result of espidf_run_task).
espidf.mcp.fetch.task.param.waitSeconds=Maximum number of seconds to wait for new output before returning. Defaults to 30; set 0 to return immediately with whatever has already arrived.
espidf.mcp.fetch.task.param.maxLines=Maximum number of trailing output lines to return. Defaults to 200; set 0 or a negative value for no limit.
espidf.mcp.fetch.task.missing.param=Missing required parameter 'taskId'. Call espidf_list_running_tasks to see running tasks.
espidf.mcp.fetch.task.not.found=No running task with taskId=%d. It may have already finished; call espidf_list_running_tasks to check.
espidf.mcp.fetch.task.finished=ESP-IDF task '%s' already finished with exitCode=%d; there is no new output to fetch.
espidf.mcp.fetch.task.running=ESP-IDF task '%s' is still running after %d seconds (status=running); new output in this window:\n
espidf.mcp.fetch.task.exited=ESP-IDF task '%s' finished with exitCode=%d; new output in this window:\n
espidf.mcp.fetch.task.no.new.output=(no new output in this window)
espidf.mcp.fetch.task.collect.failed=Failed to read the output stream of task '%s'.
espidf.mcp.fetch.task.failed=Failed to fetch task output: %s
espidf.mcp.fetch.task.field.status=Result status: 'running' when the task is still executing after the wait, 'exited' once it finished, 'not_found' when the taskId is unknown.
espidf.mcp.fetch.task.field.taskId=taskId of the fetched task.
espidf.mcp.fetch.task.field.taskName=Display name of the task.
espidf.mcp.fetch.task.field.exitCode=Process exit code; absent while the task is still running.
espidf.mcp.fetch.task.field.output=Output produced between the start of this call and the end of the wait (may be truncated).
espidf.mcp.fetch.task.field.truncated=True when the returned output was truncated to the last maxLines lines.
espidf.mcp.fetch.task.field.omittedLines=Number of leading output lines dropped due to truncation.
espidf.mcp.fetch.task.field.message=Human readable message for errors or non-result states.
